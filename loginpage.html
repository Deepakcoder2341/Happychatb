<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyChat - Login</title>
    <link rel="stylesheet" href="loginpage.css">
    <!-- Font Awesome icons for user/lock/eye icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <!-- Logo & Branding Header -->
        <div class="login-header">
            <div class="bot-icon">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h1>HappyChat ❤️</h1>
            <p>Your friendly AI companion</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="username">(Username or Email)</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" id="username" placeholder="Enter your email or user name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">(Password)</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>remember me</span>
                </label>
                <a href="#" class="forgot-password">forget password</a>
            </div>

            <button type="submit" class="login-btn">
                <a href="index.html" id="main-submit-btn" class="login-btn" style="display: block; text-align: center; text-decoration: none;">Login</a>
            </button>
        </form>

        <div class="login-footer">
            <p>not a account <a href="#">create a new account</a></p>
        </div>
    </div>

    <script src="loginpage.js"></script>
</body>
</html>
